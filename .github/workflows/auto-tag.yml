name: Auto tag on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Calculate next patch tag
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"
          next_tag="v${major}.${minor}.$((patch + 1))"

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next_tag }}"
          git push origin "${{ steps.version.outputs.next_tag }}"

      - name: Dispatch Docker image build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker-image.yml \
            --ref main \
            -f tag="${{ steps.version.outputs.next_tag }}"

      - name: Notify ntfy
        if: always()
        shell: bash
        env:
          NTFY_URL: ${{ vars.NTFY_URL || secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${NTFY_URL}" || -z "${NTFY_TOPIC}" ]]; then
            echo "NTFY_URL or NTFY_TOPIC is not configured; skipping notification."
            exit 0
          fi

          ntfy_url="${NTFY_URL%/}"
          ntfy_topic="${NTFY_TOPIC#/}"
          status_text="成功"
          tag="white_check_mark"
          if [[ "${JOB_STATUS}" == "cancelled" ]]; then
            status_text="取消"
            tag="warning"
          elif [[ "${JOB_STATUS}" != "success" ]]; then
            status_text="失败"
            tag="x"
          fi

          title="Story Matrix AI 自动打版本标签${status_text}"
          if [[ -n "${NEXT_TAG}" ]]; then
            summary="Story Matrix AI 已经打好新版本标签：${NEXT_TAG}。"
          else
            summary="Story Matrix AI 自动打版本标签${status_text}。"
          fi
          printf -v message '%s\n仓库：%s\n分支：%s\n运行记录：%s' \
            "${summary}" \
            "${{ github.repository }}" \
            "${{ github.ref_name }}" \
            "${RUN_URL}"

          if ! curl -fsS -X POST "${ntfy_url}/${ntfy_topic}" \
            -H "Title: ${title}" \
            -H "Tags: github,${tag}" \
            --data-binary "${message}"; then
            echo "::warning::Failed to send ntfy notification."
          fi
