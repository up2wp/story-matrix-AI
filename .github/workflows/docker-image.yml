name: Build Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to build, for example v0.3.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Notify ntfy
        if: always()
        shell: bash
        env:
          NTFY_URL: ${{ vars.NTFY_URL || secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${NTFY_URL}" || -z "${NTFY_TOPIC}" ]]; then
            echo "NTFY_URL or NTFY_TOPIC is not configured; skipping notification."
            exit 0
          fi

          ntfy_url="${NTFY_URL%/}"
          ntfy_topic="${NTFY_TOPIC#/}"
          status_text="成功"
          tag="white_check_mark"
          if [[ "${JOB_STATUS}" == "cancelled" ]]; then
            status_text="取消"
            tag="warning"
          elif [[ "${JOB_STATUS}" != "success" ]]; then
            status_text="失败"
            tag="x"
          fi

          title="Story Matrix AI Docker 镜像构建${status_text}"
          printf -v message 'Story Matrix AI Docker 镜像构建%s。镜像标签：%s\n仓库：%s\n分支：%s\n运行记录：%s' \
            "${status_text}" \
            "${IMAGE_TAG}" \
            "${{ github.repository }}" \
            "${{ github.ref_name }}" \
            "${RUN_URL}"

          if ! curl -fsS -X POST "${ntfy_url}/${ntfy_topic}" \
            -H "Title: ${title}" \
            -H "Tags: docker,${tag}" \
            --data-binary "${message}"; then
            echo "::warning::Failed to send ntfy notification."
          fi
