services:
  story-matrix-ai:
    build: .
    image: story-matrix-ai:local
    container_name: story-matrix-ai
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - story-matrix-data:/app/server/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  story-matrix-data:
